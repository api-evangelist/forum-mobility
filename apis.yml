aid: forum-mobility
name: Forum Mobility
description: Forum Mobility develops, owns, and operates zero-emission heavy-duty trucking infrastructure,
  bundling electric Class 8 truck leases with charging subscriptions for a single monthly price so freight
  carriers of every size can electrify without upfront capital. The company builds and runs a network of
  charging depots — anchored by its flagship FM Harbor site at the Port of Long Beach (44 ports, 360KW fast
  chargers, 9MW capacity) — with additional depots in development across California and Nevada. Forum Mobility
  was surfaced as a portfolio company of obvious-ventures and added to the API Evangelist network. It is a
  physical-infrastructure operator with no public developer/API surface at this time; this profile captures
  its identity and domain-security posture.
